<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1565C0">
  <meta name="description" content="SAPA SEKOLAH - Sistem Agenda Pembiasaan dan Informasi Sekolah">
  <title>SAPA SEKOLAH</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

  <!-- ============================================ -->
  <!-- SPLASH SCREEN - Layar pembuka aplikasi       -->
  <!-- ============================================ -->
  <div id="splash-screen" class="splash-screen">
    <div class="splash-content">
      <div class="splash-logo">
        <div class="splash-icon">
          <svg width="64" height="64" fill="none" stroke="white" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
          </svg>
        </div>
        <div class="splash-badge">📚</div>
      </div>
      <h1 class="splash-title">SAPA SEKOLAH</h1>
      <p class="splash-subtitle">Sistem Agenda Pembiasaan</p>
      <p class="splash-subtitle2">dan Informasi Sekolah</p>
      <div class="splash-dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <p class="splash-loading">Memuat aplikasi...</p>
      <div class="splash-footer">
        <p>SMK Negeri 1 Contoh</p>
        <p class="version">Versi 1.0.0</p>
      </div>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- LOGIN PAGE - Halaman masuk pengguna          -->
  <!-- ============================================ -->
  <div id="login-page" class="login-page hidden">
    <div class="login-header">
      <div class="login-logo">
        <svg width="44" height="44" fill="none" stroke="white" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
        </svg>
      </div>
      <h2>SAPA SEKOLAH</h2>
      <p>Masuk ke akun Anda</p>
    </div>
    <div class="login-form-wrapper">
      <form id="login-form" class="login-form">
        <div class="form-group">
          <label>USERNAME / NIS</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            <input type="text" id="username" placeholder="Masukkan username" required>
          </div>
        </div>
        <div class="form-group">
          <label>PASSWORD</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            <input type="password" id="password" placeholder="Masukkan password" required>
            <button type="button" class="toggle-password" onclick="togglePassword()">
              <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>
        <div class="form-options">
          <label class="checkbox-wrapper">
            <input type="checkbox" id="remember">
            <span class="checkmark"></span>
            <span>Ingat saya</span>
          </label>
          <a href="#" class="forgot-link">Lupa password?</a>
        </div>
        <button type="submit" class="btn-primary btn-full">Masuk</button>
        <p class="login-help">Hubungi admin jika belum punya akun</p>
      </form>

      <!-- Pilih Role untuk Demo -->
      <div class="demo-roles">
        <p class="demo-title">🔐 Demo — Pilih Peran:</p>
        <div class="demo-role-grid">
          <button class="demo-role-btn" onclick="demoLogin('siswa')">🎒<span>Siswa</span></button>
          <button class="demo-role-btn" onclick="demoLogin('guru')">👩‍🏫<span>Guru</span></button>
          <button class="demo-role-btn" onclick="demoLogin('wali')">📋<span>Wali Kelas</span></button>
          <button class="demo-role-btn" onclick="demoLogin('kepsek')">🏅<span>Kepsek</span></button>
          <button class="demo-role-btn" onclick="demoLogin('admin')">⚙️<span>Admin</span></button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- APP SHELL - Kerangka utama aplikasi          -->
  <!-- ============================================ -->
  <div id="app" class="app-shell hidden">
    <!-- Area konten halaman (di-render oleh JavaScript) -->
    <main id="page-content"></main>

    <!-- Bottom Navigation Bar -->
    <nav id="bottom-nav" class="bottom-nav">
      <button class="nav-item active" data-page="dashboard">
        <svg fill="currentColor" viewBox="0 0 24 24">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
        </svg>
        <span>Beranda</span>
      </button>
      <button class="nav-item" data-page="kalender">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="18" rx="2" stroke-width="2" />
          <path d="M16 2v4M8 2v4M3 10h18" stroke-width="2" stroke-linecap="round" />
        </svg>
        <span>Kalender</span>
      </button>
      <button class="nav-item" data-page="informasi">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V9a2 2 0 012-2h2a2 2 0 012 2v9a2 2 0 01-2 2h-2z" />
        </svg>
        <span>Informasi</span>
      </button>
      <button class="nav-item" data-page="notifikasi">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>
        <span>Notifikasi</span>
        <span class="badge" id="notif-badge">3</span>
      </button>
      <button class="nav-item" data-page="profil">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        <span>Profil</span>
      </button>
    </nav>
  </div>

  <!-- JavaScript Files -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
